<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reformer Class Planner</title>
    <style>
        :root {
            --bg: #f6f5f2;
            --card: #ffffff;
            --text: #23211e;
            --muted: #6b665e;
            --border: #e2ded6;
            --accent: #2f6f62;
            --accent-text: #ffffff;
            --chip: #f1efea;
            --chip-checked: #dcebe7;
            --error-bg: #fbeaea;
            --error-text: #8a2323;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1918;
                --card: #242321;
                --text: #ece9e3;
                --muted: #a39e95;
                --border: #3a3834;
                --accent: #5fb3a1;
                --accent-text: #10201c;
                --chip: #2e2d2a;
                --chip-checked: #24423b;
                --error-bg: #3a2020;
                --error-text: #f2b8b8;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 24px 16px 48px;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, "Segoe UI", Arial, sans-serif;
            line-height: 1.6;
        }

        main { max-width: 760px; margin: 0 auto; }

        h1 { margin: 0 0 4px; font-size: 1.8rem; }
        .intro { margin: 0 0 24px; color: var(--muted); }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        fieldset { border: none; margin: 0 0 20px; padding: 0; }
        legend { font-weight: 600; margin-bottom: 8px; padding: 0; }
        .hint { font-weight: 400; color: var(--muted); font-size: 0.9rem; }

        .options { display: flex; flex-wrap: wrap; gap: 8px; }

        .options label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--chip);
            border: 1px solid var(--border);
            border-radius: 999px;
            cursor: pointer;
            user-select: none;
        }
        .options label:has(input:checked) {
            background: var(--chip-checked);
            border-color: var(--accent);
        }
        .options input { accent-color: var(--accent); margin: 0; }

        button {
            font: inherit;
            font-weight: 600;
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: var(--accent-text);
            cursor: pointer;
        }
        button:disabled { opacity: 0.55; cursor: wait; }

        .status { margin-top: 16px; color: var(--muted); }
        .status:empty { display: none; }

        .error {
            padding: 12px 16px;
            border-radius: 8px;
            background: var(--error-bg);
            color: var(--error-text);
        }
        .error:empty { display: none; }

        #lesson:empty { display: none; }
        #lesson h2, #lesson h3, #lesson h4 { margin: 20px 0 8px; line-height: 1.3; }
        #lesson h2:first-child, #lesson h3:first-child, #lesson h4:first-child { margin-top: 0; }
        #lesson p { margin: 0 0 10px; }
        #lesson ul, #lesson ol { margin: 0 0 12px; padding-inline-start: 22px; }
        #lesson li { margin-bottom: 4px; }
        #lesson hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
    </style>
</head>
<body>
<main>
    <h1>מתכנן שיעורי רפורמר</h1>
    <p class="intro">בחרי את פרטי השיעור, וקבלי מערך שיעור מוכן.</p>

    <form id="class-form" class="card">
        <fieldset>
            <legend>רמה</legend>
            <div class="options">
                <label><input type="radio" name="level" value="beginner" required> מתחילות</label>
                <label><input type="radio" name="level" value="intermediate"> בינוניות</label>
                <label><input type="radio" name="level" value="advanced"> מתקדמות</label>
            </div>
        </fieldset>

        <fieldset>
            <legend>התוויות נגד <span class="hint">(אפשר לבחור כמה)</span></legend>
            <div class="options">
                <label><input type="checkbox" name="conditions" value="pregnancy"> הריון</label>
                <label><input type="checkbox" name="conditions" value="lower_back_pain"> כאבי גב תחתון</label>
                <label><input type="checkbox" name="conditions" value="knee_injury"> פציעה בברך</label>
                <label><input type="checkbox" name="conditions" value="hip_injury"> פציעה במפרק הירך</label>
                <label><input type="checkbox" name="conditions" value="shoulder_injury"> פציעה בכתף</label>
                <label><input type="checkbox" name="conditions" value="neck_injury"> פציעה בצוואר</label>
                <label><input type="checkbox" name="conditions" value="wrist_injury"> פציעה בשורש כף היד</label>
                <label><input type="checkbox" name="conditions" value="elbow_injury"> פציעה במרפק</label>
                <label><input type="checkbox" name="conditions" value="achilles_injury"> פציעה בגיד אכילס</label>
                <label><input type="checkbox" name="conditions" value="osteoporosis"> אוסטאופורוזיס</label>
                <label><input type="checkbox" name="conditions" value="high_blood_pressure"> לחץ דם גבוה</label>
            </div>
        </fieldset>

        <fieldset>
            <legend>אזורי גוף <span class="hint">(אפשר לבחור כמה)</span></legend>
            <div class="options">
                <!-- Each option sends one or more body_focus values from the data, separated by commas. -->
                <label><input type="checkbox" name="focus_areas" value="glutes"> ישבן</label>
                <label><input type="checkbox" name="focus_areas" value="legs,hamstrings,calves"> רגליים</label>
                <label><input type="checkbox" name="focus_areas" value="inner_thighs"> ירך פנימית</label>
                <label><input type="checkbox" name="focus_areas" value="arms,biceps,triceps"> ידיים</label>
                <label><input type="checkbox" name="focus_areas" value="shoulders"> כתפיים</label>
                <label><input type="checkbox" name="focus_areas" value="back"> גב</label>
                <label><input type="checkbox" name="focus_areas" value="core,obliques"> בטן</label>
                <label><input type="checkbox" name="focus_areas" value="chest"> חזה</label>
            </div>
        </fieldset>

        <button type="submit" id="submit-button">בני לי שיעור</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
    </form>

    <p id="error" class="error" role="alert"></p>
    <article id="lesson" class="card"></article>
</main>

<script>
    const form = document.getElementById("class-form");
    const button = document.getElementById("submit-button");
    const statusLine = document.getElementById("status");
    const errorBox = document.getElementById("error");
    const lessonBox = document.getElementById("lesson");

    // Collect the values of all checked boxes with the same name.
    function checkedValues(name) {
        const boxes = form.querySelectorAll(`input[name="${name}"]:checked`);
        return Array.from(boxes, box => box.value);
    }

    // Collect the body_focus values of the checked areas.
    // One option can stand for several values, written like "core,obliques".
    function focusValues() {
        return checkedValues("focus_areas").flatMap(value => value.split(","));
    }

    // Turn FastAPI's error answer into one readable message.
    async function errorMessage(response) {
        try {
            const data = await response.json();
            if (typeof data.detail === "string") {
                return data.detail;
            }
            if (Array.isArray(data.detail)) {
                return data.detail.map(item => item.msg).join(", ");
            }
        } catch {
            // The answer was not JSON (for example "Internal Server Error").
        }
        return `השרת החזיר שגיאה (${response.status}).`;
    }

    // Add text to an element. Text between ** and ** becomes bold.
    function addText(element, text) {
        const pieces = text.split("**");
        pieces.forEach((piece, index) => {
            if (index % 2 === 1) {
                const bold = document.createElement("strong");
                bold.textContent = piece;
                element.appendChild(bold);
            } else {
                element.appendChild(document.createTextNode(piece));
            }
        });
    }

    // Show the lesson. Handles the simple Markdown the model writes:
    // headings (#), numbered lists (1.), bullet lists (- or *), bold (**) and lines (---).
    // Indented bullets under a numbered exercise are shown inside that exercise.
    function showLesson(text) {
        lessonBox.replaceChildren();
        let numberedList = null;  // The current <ol> of exercises.
        let exercise = null;      // The last exercise <li>, for its indented details.
        let details = null;       // The <ul> of details inside that exercise.
        let bulletList = null;    // A bullet list that is not inside an exercise.
        // The last number shown. Goes back to 0 after a heading.
        let lastNumber = 0;

        function endLists() {
            numberedList = null;
            exercise = null;
            details = null;
            bulletList = null;
        }

        for (const rawLine of text.split("\n")) {
            const line = rawLine.trim();
            const indented = /^\s/.test(rawLine);

            // A blank line doesn't end a list: the model puts blank lines between exercises.
            if (line === "") {
                continue;
            }

            const heading = line.match(/^(#{1,6})\s+(.*)$/);
            const numbered = line.match(/^(\d+)[.)]\s+(.*)$/);
            const bullet = line.match(/^[-*]\s+(.*)$/);

            if (heading) {
                const level = Math.min(heading[1].length + 1, 4);
                const element = document.createElement(`h${level}`);
                // Remove a number at the start, like "2. " or "**2. ", so it isn't
                // confused with the exercise numbers. Keeps the ** for bold.
                const title = heading[2].replace(/^(\*\*)?\s*\d+[.)]\s*/, "$1");
                addText(element, title);
                lessonBox.appendChild(element);
                endLists();
                lastNumber = 0;
            } else if (/^(-{3,}|\*{3,})$/.test(line)) {
                lessonBox.appendChild(document.createElement("hr"));
                endLists();
            } else if (numbered) {
                if (!numberedList) {
                    endLists();
                    numberedList = document.createElement("ol");
                    lessonBox.appendChild(numberedList);
                }
                // Use the model's number if it continues the count.
                // If it repeats or goes back (1, 1, 1...), count on from the last number.
                const written = Number(numbered[1]);
                lastNumber = written > lastNumber ? written : lastNumber + 1;
                exercise = document.createElement("li");
                exercise.value = lastNumber;
                addText(exercise, numbered[2]);
                numberedList.appendChild(exercise);
                details = null;
            } else if (bullet && indented && exercise) {
                // A detail of the exercise above it, like springs or repetitions.
                if (!details) {
                    details = document.createElement("ul");
                    exercise.appendChild(details);
                }
                const item = document.createElement("li");
                addText(item, bullet[1]);
                details.appendChild(item);
            } else if (bullet) {
                if (!bulletList) {
                    endLists();
                    bulletList = document.createElement("ul");
                    lessonBox.appendChild(bulletList);
                }
                const item = document.createElement("li");
                addText(item, bullet[1]);
                bulletList.appendChild(item);
            } else if (indented && exercise) {
                // Indented text under an exercise, without a bullet.
                const paragraph = document.createElement("div");
                addText(paragraph, line);
                exercise.appendChild(paragraph);
            } else {
                const paragraph = document.createElement("p");
                addText(paragraph, line);
                lessonBox.appendChild(paragraph);
                endLists();
            }
        }
    }

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const body = {
            level: form.querySelector('input[name="level"]:checked').value,
            conditions: checkedValues("conditions"),
            focus_areas: focusValues(),
        };

        button.disabled = true;
        statusLine.textContent = "בונה את השיעור... זה יכול לקחת עד דקה.";
        errorBox.textContent = "";
        lessonBox.replaceChildren();

        try {
            const response = await fetch("/class", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body),
            });

            if (!response.ok) {
                errorBox.textContent = await errorMessage(response);
                return;
            }

            const data = await response.json();
            showLesson(data.lesson);
        } catch {
            errorBox.textContent = "אין חיבור לשרת. בדקי שהשרת רץ ונסי שוב.";
        } finally {
            button.disabled = false;
            statusLine.textContent = "";
        }
    });
</script>
</body>
</html>
